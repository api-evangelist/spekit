gating_detail: >-
  Spekit runs a changelog and a roadmap, and links both from its own support documentation, but
  neither is publicly readable. https://spekit.canny.io/changelog returns HTTP 200 whose body is
  only a login wall — "Log in with your admin account to access this page" — and
  https://spekit.canny.io/feature-requests is the same wall requiring a Spekit account. There is
  no RSS/Atom feed, no anonymous JSON, and no release-notes section in the Zendesk help center
  (36 sections enumerated, none of them release notes). A dated change history therefore exists
  but cannot be read, cited, or diffed by anyone who is not already a Spekit customer.
