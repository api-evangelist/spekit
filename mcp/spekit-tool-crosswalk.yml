method: derived
source: mcp/spekit-mcp.yml + openapi/spekit-openapi.yml
note: >-
  Spekit's two programmatic surfaces do not overlap at all. The public REST API (5 operations,
  all GET) is a read-only ANALYTICS/reporting surface — users, searches, spek views, spek
  reactions, user activities — built for BI dashboards and user syncs. The MCP connector (19
  tools) is a CONTENT surface — search, read, author and update Speks, topics, templates,
  companies and Deal Rooms. Not one MCP tool has a backing public REST operation, and not one
  REST operation has a corresponding MCP tool. Spekit's own MCP FAQ states the connector's tools
  "call the same backend API as the website and extension", meaning the tools are bound to
  INTERNAL first-party endpoints that are not part of the published api.spekit.co/v1 contract.
  The crosswalk is therefore empty by measurement, not by omission — that disjointness is the
  finding.
surfaces:
