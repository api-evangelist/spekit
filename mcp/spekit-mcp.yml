governance:
  write_confirmation: >-
    Every write tool is annotated as able to change data, and the calling AI tool prompts the user
    to confirm before it runs. The confirmation is enforced by the AI client via the MCP standard,
    not by a Spekit-side setting — Spekit's own docs recommend validating this per tool/session.
  read_only_mode: >-
    Not available. Access is bounded by the authenticated user's Spekit role only; there is no
    setting that forces the connector read-only independent of role. A company-level feature flag
    controls whether the connector is enabled at all; admins can control which tools users see
    inside their AI tool's Connectors section.
  scoping: Cannot be scoped to specific Topics or Deal Rooms — scope is the user's own visibility.
  rate_limited: true
  rate_limit_note: Enforced per session; quota enforcement validated across service instances.
  logging: >-
    Question and answer content is not logged. Operational metadata only — tool called,
    success/failure, response time, calling user identity.
  retention: access tokens 24h; refresh tokens 30d; logs 100d; traces 7d; metrics 180d
  training_on_customer_data: false
  hosting: Same AWS infrastructure and region as the core Spekit platform, under the existing DPA.
  penetration_tested: >-
    Not yet as a dedicated target — the MCP server is in scope for the next security assessment
    (testing planned Sept–Oct); the backend services it proxies were independently pen-tested
    within the past year. Spekit maintains a company-wide SOC 2 Type II report.
limitations:
- No delete of any kind through the connector.
- Topics, companies and deal rooms are create-only — they cannot be renamed or edited after creation.
- An existing Spek cannot be copied/attached into a Deal Room; only new content can be created there.
- Cannot enable external Deal Room sharing, and cannot report whether sharing is already on.
- Cannot manage users, roles or permissions.
- Content created via the connector does not use Brand Studio styling yet.
- Topic hierarchy is returned one level at a time; deeper levels need a follow-up call.
