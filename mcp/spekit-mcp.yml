server:
  name: spekit
  display_name: Spekit MCP
  description: >-
    The Spekit MCP connector exposes governed Spekit GTM content — Speks, topics, templates,
    companies and Deal Rooms — to any AI tool that supports a custom MCP connector by URL with
    dynamic client registration. Every call runs as the signed-in user and is scoped to that
    user's existing Spekit role; the connector grants no access the user does not already have
    in the Spekit web app, and enforcement is at the backend API layer, not in the connector.
  transport: http
  url: https://mcp.spekit.co/mcp
  compatible_clients:
  - Claude (Pro, Max, Team, Enterprise)
  - ChatGPT (Pro, Business, Enterprise, Education — writes limited to Business/Enterprise/Education)
  - Gemini CLI
  - Codex CLI
  - Gong
  cost: Included with every Spekit account at no extra cost; no separate seat or add-on.
  marketplace_listings: none yet — Spekit states it is in the submission queue for the AI tool marketplaces.
deployment:
  mode: remote
  endpoint: https://mcp.spekit.co/mcp
  auth: oauth
  verified: probed
  checked: '2026-08-14'
  evidence:
  - probe: POST https://mcp.spekit.co/mcp {"jsonrpc":"2.0","id":1,"method":"tools/list"}
    http_status: 401
    body: '{"error": "invalid_token", "error_description": "Authentication failed..."}'
    www_authenticate: >-
      Bearer error="invalid_token", resource_metadata="https://mcp.spekit.co/.well-known/oauth-protected-resource/mcp"
  - probe: GET https://mcp.spekit.co/.well-known/oauth-authorization-server
    http_status: 200
    file: ../well-known/spekit-mcp-oauth-authorization-server.json
  - probe: GET https://mcp.spekit.co/.well-known/oauth-protected-resource/mcp
    http_status: 200
    file: ../well-known/spekit-mcp-oauth-protected-resource.json
authorization:
  model: OAuth 2.0 authorization code with PKCE (S256 required)
  dynamic_client_registration: true
  registration_endpoint: https://mcp.spekit.co/register
  authorization_endpoint: https://mcp.spekit.co/authorize
  token_endpoint: https://mcp.spekit.co/token
  issuer: https://mcp.spekit.co/
  scopes: [openid, profile, email, read]
  machine_to_machine: false
  note: >-
    Spekit states there is no client-credentials / machine-to-machine path — every connection
    requires an interactive sign-in and consent with the user's own Spekit login.
  access_token_lifetime: 24 hours
  refresh_token_lifetime: 30 days, rotating on every use (prior token cancelled on refresh)
  token_format: RS256-signed JWT verified against the IdP JWKS, checking issuer and audience
tools_schema_status: >-
