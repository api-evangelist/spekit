aid: spekit
name: Spekit
description: >-
  Spekit is an AI-powered revenue enablement platform for B2B sales teams,
  delivering coaching, content, and deal intelligence inside rep workflows. Its
  GTM Knowledge Engine keeps governed go-to-market knowledge accurate and
  on-brand, pairs agentic coaching (the AI Sidekick) with unified deal context
  from Salesforce, Gong, and email, and generates personalized buyer experiences
  such as automated deal rooms. Spekit exposes its governed knowledge to AI
  agents over the Model Context Protocol (MCP) so any LLM or MCP-enabled tool
  always has the latest content. It is SOC 2 Type II audited and integrates
  across Salesforce, Slack, Gmail, Outlook, HubSpot, and major SSO providers.
  Spekit does not publish a public developer REST API; its programmatic surface
  is the MCP server plus SaaS integrations. Surfaced as a portfolio company of
  Craft Ventures, Felicis, and Foundry Group and enriched by the API Evangelist
  pipeline.
